[DLAA]
; 1 = NVIDIA DLAA replaces RenderHook's TAA (settings.xml TAA EnableTAA must stay "true"). 0 = off.
Enabled=1
; DLSS preset: 0 = NVIDIA's default (K, transformer model), 10 = J (a bit less ghosting, a bit more flicker), 11 = K
Preset=0
; key that switches between DLAA and RenderHook's TAA while playing, as a Windows virtual-key code (0x78 = F9, 0 = none)
ToggleKey=0x78
; If the image looks soft or wobbles slightly when standing still, try -1 here (jitter direction convention)
JitterSignX=1
JitterSignY=1
; camera jumps farther than this (metres, in one frame) start DLAA's history fresh, e.g. cutscene cuts
ResetDistance=30
